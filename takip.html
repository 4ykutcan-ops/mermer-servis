<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Servis Takip | Mermer İletişim</title>
<style>
  :root{--bg:#f4f6f5;--card:#fff;--ink:#101714;--mute:#5d6b65;--line:#e1e7e4;--em:#0f8a5f;--em-s:#e3f4ec;--amber:#b45309;--amber-s:#fef3c7;--red:#b42318;--red-s:#fee4e2}
  @media (prefers-color-scheme:dark){:root{--bg:#0c120f;--card:#141c18;--ink:#eef3f0;--mute:#9aa9a1;--line:#243029;--em:#3ccf91;--em-s:#12291f;--amber:#fbbf24;--amber-s:#2b2410;--red:#fda29b;--red-s:#2d1512}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:560px;margin:0 auto;padding:20px 16px 48px}
  header{display:flex;align-items:center;gap:12px;margin:8px 0 20px}
  .mark{width:40px;height:40px;border-radius:11px;background:var(--em);color:#fff;display:grid;place-items:center;font-weight:700}
  header b{display:block;font-size:17px;letter-spacing:-.01em}
  header span{font-size:13px;color:var(--mute)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
  h1{font-size:20px;margin:0 0 4px;letter-spacing:-.01em}
  p.sub{margin:0 0 16px;color:var(--mute);font-size:14px}
  label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
  input{width:100%;font:inherit;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
  input:focus{outline:2px solid var(--em);outline-offset:1px}
  .grp{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:12px;background:var(--bg);overflow:hidden}
  .grp:focus-within{outline:2px solid var(--em);outline-offset:1px}
  .grp span{display:grid;place-items:center;padding:0 12px;font-weight:700;color:var(--mute);border-right:1px solid var(--line);letter-spacing:.05em}
  .grp input{border:0;border-radius:0;background:transparent;outline:0!important;letter-spacing:.05em}
  button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:12px;background:var(--em);color:#fff;font:inherit;font-weight:650;cursor:pointer}
  button:disabled{opacity:.6;cursor:default}
  .err{background:var(--red-s);color:var(--red);border-radius:12px;padding:12px 14px;font-size:14px;margin-top:14px}
  .hide{display:none}
  .top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
  .code{font:600 12px ui-monospace,Menlo,monospace;background:var(--em-s);color:var(--em);padding:3px 9px;border-radius:8px;display:inline-block}
  h2{font-size:21px;margin:8px 0 2px;letter-spacing:-.01em}
  .muted{color:var(--mute);font-size:13px}
  .status{display:inline-block;margin-top:6px;padding:6px 12px;border-radius:10px;background:var(--em);color:#fff;font-weight:650;font-size:14px}
  .steps{list-style:none;margin:20px 0 0;padding:0}
  .steps li{display:flex;gap:12px;align-items:center;padding:7px 0;color:var(--mute);font-size:14px;position:relative}
  .steps li::before{content:"";width:14px;height:14px;border-radius:50%;border:2px solid var(--line);flex:none;background:var(--card)}
  .steps li small{margin-left:auto;font-size:12px;color:var(--mute);font-weight:400}
  .steps li.done{color:var(--ink)}
  .steps li.done::before{background:var(--em);border-color:var(--em)}
  .steps li.now{font-weight:700;color:var(--ink)}
  .steps li.now::before{box-shadow:0 0 0 4px var(--em-s)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
  .box{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .box small{display:block;color:var(--mute);font-size:12px}
  .box strong{font-size:17px}
  .note{border-radius:12px;padding:12px 14px;font-size:14px;margin-top:16px}
  .note.amber{background:var(--amber-s);color:var(--amber)}
  .note.green{background:var(--em-s);color:var(--em)}
  .issue{margin-top:16px;font-size:14px;color:var(--mute)}
  .issue b{color:var(--ink)}
  footer{text-align:center;color:var(--mute);font-size:12px;margin-top:20px}
</style>
</head>
<body>
<div class="wrap">
  <header><div class="mark">M</div><div><b>Mermer İletişim</b><span>Servis Takip</span></div></header>

  <form id="form" class="card" autocomplete="off">
    <h1>Cihazınızın durumunu öğrenin</h1>
    <p class="sub">Servis fişinizdeki takip numarasını (SRV- den sonraki rakamlar) ve kayıtlı telefon numaranızın son 4 hanesini girin.</p>
    <label for="no">Takip Numarası</label>
    <div class="grp"><span>SRV-</span><input id="no" required inputmode="numeric" pattern="[0-9]{1,6}" maxlength="6" placeholder="102"></div>
    <label for="p4">Telefon Numaranızın Son 4 Hanesi</label>
    <input id="p4" required inputmode="numeric" pattern="[0-9]{4}" maxlength="4" placeholder="4567">
    <button id="btn" type="submit">Sorgula</button>
    <div id="err" class="err hide" role="alert"></div>
  </form>

  <div id="result" class="card hide"></div>
  <footer>Bilgi için bizi arayabilirsiniz • Mermer İletişim</footer>
</div>

<script>
// Cloudflare Worker adresinizi buraya yazın (sonunda / olmadan):
const API_URL = 'https://mermer-whatsapp.4ykutcan.workers.dev';

const STATUSES = ['Kabul Edildi','İnceleniyor','Müşteri Onayı Bekliyor','Parça Bekleniyor','Tamirde','Hazır','Teslim Edildi'];
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
const fmtDate = (t) => new Date(t).toLocaleDateString('tr-TR', { day: '2-digit', month: 'long', year: 'numeric' });
const money = (v) => Number(v).toLocaleString('tr-TR') + ' ₺';

// Adres çubuğundan ön doldurma: takip.html?no=SRV-2026-101
try { const n = new URLSearchParams(location.search).get('no'); if (n) $('no').value = (n.match(/(\d+)\s*$/) || [''])[1]; } catch (e) {}

function showError(msg) { const e = $('err'); e.textContent = msg; e.classList.remove('hide'); }

function render(o) {
  const r = $('result'); r.innerHTML = '';
  const idx = Math.max(0, STATUSES.indexOf(o.status));

  const top = el('div', 'top');
  const left = el('div');
  left.append(el('span', 'code', o.trackingNo), el('h2', '', o.deviceModel), el('div', 'muted', `Sayın ${o.customerName} • Kabul: ${fmtDate(o.createdAt)}`));
  const right = el('div');
  right.append(el('div', 'muted', 'Güncel durum'), el('span', 'status', o.status));
  top.append(left, right);
  r.append(top);

  const ol = el('ol', 'steps');
  const times = {};
  (o.history || []).forEach(h => { times[h.status] = h.at; });
  if (!times['Kabul Edildi'] && o.createdAt) times['Kabul Edildi'] = o.createdAt;
  const fmtShort = (t) => new Date(t).toLocaleString('tr-TR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
  STATUSES.forEach((s, i) => {
    const li = el('li', i < idx ? 'done' : i === idx ? 'done now' : '', s);
    if (i <= idx && times[s]) li.append(el('small', '', fmtShort(times[s])));
    ol.append(li);
  });
  r.append(ol);

  if (o.status === 'Müşteri Onayı Bekliyor' && !o.approved) {
    r.append(el('div', 'note amber', 'Cihazınız için fiyat onayınız bekleniyor. Lütfen bizi arayarak onay verin.'));
  } else if (o.status === 'Hazır') {
    r.append(el('div', 'note green', 'Cihazınız hazır. Teslim almak için bekliyoruz.'));
  }

  const grid = el('div', 'grid');
  const price = el('div', 'box'); price.append(el('small', '', 'Onarım Tutarı'));
  if (o.customerPrice === null || o.customerPrice === undefined) {
    price.append(el('strong', '', 'Belirlenmedi'), el('small', '', 'Arıza tespitinden sonra bildirilecek'));
  } else {
    price.append(el('strong', '', money(o.customerPrice)), el('small', '', o.approved ? '✓ Onaylandı' : 'Onayınız bekleniyor'));
  }
  const warr = el('div', 'box'); warr.append(el('small', '', 'Garanti'), el('strong', '', o.warranty || '-'));
  grid.append(price, warr);
  r.append(grid);

  if (o.issueDesc) { const d = el('div', 'issue'); d.append(el('b', '', 'Yapılan / planlanan işlem: '), document.createTextNode(o.issueDesc)); r.append(d); }
  r.classList.remove('hide');
  r.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

$('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('err').classList.add('hide'); $('result').classList.add('hide');
  const btn = $('btn'); btn.disabled = true; btn.textContent = 'Sorgulanıyor…';
  try {
    const res = await fetch(API_URL.replace(/\/+$/, '') + '/api/track', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ trackingNo: $('no').value.replace(/\D/g, ''), phone4: $('p4').value.trim() })
    });
    const d = await res.json().catch(() => ({}));
    if (!res.ok || !d.ok) throw new Error(d.error || 'Sorgu yapılamadı. Lütfen daha sonra tekrar deneyin.');
    render(d.order);
  } catch (err) {
    showError(err instanceof TypeError ? 'Bağlantı kurulamadı. İnternetinizi kontrol edip tekrar deneyin.' : err.message);
  } finally { btn.disabled = false; btn.textContent = 'Sorgula'; }
});
</script>
</body>
</html>
